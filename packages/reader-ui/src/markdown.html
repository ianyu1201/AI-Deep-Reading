<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知识库 · Markdown</title><link rel="icon" href="data:,"><link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="markdown.css"><script type="module" src="markdown.js"></script><link rel="stylesheet" href="./motion.css"><script src="./motion.js"></script></head><body>
<div class="obs-app"><aside class="ribbon" aria-label="工具栏"><div class="ribbon-top"></div><button id="quick-open" class="icon-button" aria-label="打开快速切换" title="打开快速切换"><i data-icon="FileText"></i></button><button id="import-markdown" class="icon-button" title="打开 Markdown 文件" aria-label="打开 Markdown 文件"><i data-icon="Files"></i></button></aside>
<aside id="file-sidebar" class="file-sidebar"><header class="sidebar-tabs"><button id="files-tab" class="icon-button active" aria-label="文件列表" title="文件列表"><i data-icon="FolderClosed"></i></button><button id="search-tab" class="icon-button" aria-label="搜索" title="搜索"><i data-icon="Search"></i></button><button id="hide-sidebar" class="icon-button push-right" aria-label="收起左侧栏" title="收起左侧栏"><i data-icon="PanelLeftClose"></i></button></header>
<div id="files-tools" class="files-tools"><button id="new-note" class="icon-button" aria-label="新建笔记" title="新建笔记"><i data-icon="SquarePen"></i></button><button id="sort-notes" class="icon-button" aria-label="排序" title="排序"><i data-icon="ArrowUpDown"></i></button><button id="collapse-all" class="icon-button" aria-label="全部折叠" title="全部折叠"><i data-icon="ChevronsDownUp"></i></button></div><div id="search-tools" hidden><input id="note-search" placeholder="搜索…" aria-label="搜索笔记"></div><nav id="file-tree" aria-label="文件列表"></nav><footer class="vault-bar"><span title="当前为演示草稿，尚未连接真实知识库">书籍知识库</span><button id="help" class="icon-button" aria-label="原型说明" title="原型说明"><i data-icon="CircleHelp"></i></button><button id="settings" class="icon-button" aria-label="设置" title="设置"><i data-icon="Settings"></i></button></footer></aside>
<main class="note-workspace"><div class="tab-bar"><button id="show-sidebar" aria-expanded="false" title="展开左侧栏" class="icon-button" aria-label="展开左侧栏" hidden><i data-icon="PanelLeftOpen"></i></button><div id="note-tabs" role="tablist" aria-label="已打开的笔记"></div><button id="new-tab" class="icon-button" aria-label="新标签页" title="新标签页"><i data-icon="Plus"></i></button><div class="tab-fill"></div><button id="outline-toggle" class="icon-button" aria-label="切换右侧栏" title="切换右侧栏"><i data-icon="PanelRight"></i></button></div>
<div class="workspace-content"><section class="note-pane"><header class="note-header"><button id="note-back" class="icon-button" aria-label="返回" title="返回"><i data-icon="ArrowLeft"></i></button><button id="note-forward" class="icon-button" aria-label="前进" title="前进"><i data-icon="ArrowRight"></i></button><div id="breadcrumb"></div><button id="note-mode" class="icon-button" aria-label="切换至阅读视图" title="切换至阅读视图"><i data-icon="BookOpen"></i></button><button id="note-options" class="icon-button" aria-label="更多选项" title="更多选项"><i data-icon="Ellipsis"></i></button></header><div id="note-scroll"><div class="document"><h1 id="note-title"></h1><div id="editor"></div><article id="note-preview" hidden></article></div></div></section><aside id="outline" class="outline" hidden><header><i data-icon="ListTree"></i>大纲</header><nav id="outline-list"></nav><h3>反向链接</h3><div id="backlinks"></div></aside></div>
<footer class="status-bar"><span id="save-state">浏览器草稿</span><span id="backlink-count"></span><span id="mode-status">实时阅览</span><span id="word-count"></span></footer></main></div>
<div id="note-menu" class="note-menu" hidden></div><dialog id="dialog"><header><h2 id="dialog-title"></h2><button id="close-dialog" class="icon-button" aria-label="关闭"><i data-icon="X"></i></button></header><div id="dialog-content"></div></dialog><input id="markdown-file" type="file" accept=".md,.markdown,.txt" hidden><div id="toast" class="toast" role="status" hidden></div><script src="./appearance.js"></script></body></html>
