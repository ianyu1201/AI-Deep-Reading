<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>图书 · EPUB 阅读器</title><link rel="icon" href="data:,"><link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="books.css"><script type="module" src="books.js"></script><link rel="stylesheet" href="./motion.css"><script src="./motion.js"></script></head><body>
<section id="library-view" class="books-app">

<main class="book-main"><header class="library-toolbar"><div class="library-heading"><h1 id="library-title">书库</h1><p>阅读 · 思考 · 与 AI 对话 · 记录你的洞见</p></div><label class="library-search"><i data-icon="Search"></i><input id="library-query" type="search" placeholder="搜索书名或作者" aria-label="搜索书库"></label><button id="apple-connect" class="text-button" hidden><i class="apple-books-icon" data-icon="BookOpen" aria-hidden="true"></i><span>连接 Apple Books</span></button><button id="library-menu" aria-label="书库操作" class="round-button"><i data-icon="Ellipsis"></i></button></header>
<div class="library-scroll"><div id="book-grid" class="book-grid"></div><p id="library-empty" class="empty" hidden>这里还没有图书</p><aside class="sample-note"><i class="library-tip-icon" data-icon="Lightbulb" aria-hidden="true"></i><div><p class="library-tip-title">展示书目来自 Project Gutenberg · 可从右上角导入 EPUB</p><p class="library-tip-detail">与 AI 一起深入阅读，记录你的思考与收获</p></div></aside></div></main></section>
<section id="reading-view" class="reading-view" hidden aria-label="EPUB 阅读页">
<header class="reading-toolbar"><div class="reader-left"><button id="back-library" class="icon-button" aria-label="返回书库" title="返回书库"><i data-icon="ChevronLeft"></i></button><button id="immersive-return" class="text-button" hidden title="返回工作台（Esc）">返回工作台</button><button id="toc-toggle" class="icon-button" aria-label="目录" title="目录"><i data-icon="List"></i></button></div><div class="immersive-pages" hidden><button id="immersive-previous" class="icon-button" aria-label="上一页" title="上一页（←）"><i data-icon="ChevronLeft"></i></button><button id="immersive-next" class="icon-button" aria-label="下一页" title="下一页（→）"><i data-icon="ChevronRight"></i></button></div><span id="reading-title"></span><div class="reader-right"><button id="immersive-toggle" class="text-button" title="沉浸阅读">沉浸阅读</button><button id="appearance-toggle" class="icon-button" aria-label="主题与设置" title="主题与设置"><i data-icon="ALargeSmall"></i></button><button id="reader-search-toggle" class="icon-button" aria-label="搜索书内文字" title="搜索"><i data-icon="Search"></i></button></div></header>
<div id="reader" aria-label="书籍正文"></div><button id="previous-page" class="page-arrow previous" aria-label="上一页"><i data-icon="ChevronLeft"></i></button><button id="next-page" class="page-arrow next" aria-label="下一页"><i data-icon="ChevronRight"></i></button><footer class="reading-footer"><span id="reading-location"></span><span id="reading-progress"></span></footer>
<aside id="toc-panel" class="popover left-popover" hidden><header><strong>目录</strong><button class="icon-button close-popover" aria-label="关闭目录"><i data-icon="X"></i></button></header><nav id="toc" aria-label="章节目录"></nav></aside>
<aside id="search-panel" class="popover right-popover" hidden><header><strong>搜索</strong><button class="icon-button close-popover" aria-label="关闭搜索"><i data-icon="X"></i></button></header><input id="reader-query" aria-label="搜索本书" placeholder="搜索本书"><div id="reader-results"></div></aside>
<aside id="appearance-panel" class="popover right-popover appearance" hidden><header><strong>主题与设置</strong><button class="icon-button close-popover" aria-label="关闭设置"><i data-icon="X"></i></button></header><div class="font-buttons"><button id="font-minus" aria-label="减小字号">A</button><span id="font-size">18</span><button id="font-plus" aria-label="增大字号">A</button></div><div class="themes"><button data-theme="paper">纸张</button><button data-theme="white">白色</button><button data-theme="dark">夜间</button></div><p>阅读方式：<span id="reading-flow">纵向滚动</span></p><label>行距<select id="reading-spacing"><option value="1.6">标准</option><option value="1.9">宽松</option><option value="2.2">更宽松</option></select></label></aside>
<div id="reader-loading" class="reader-message" role="status" hidden>正在打开图书…</div><div id="reader-error" class="reader-message" role="alert" hidden></div>
</section>
<div id="library-actions" class="dropdown" hidden></div><div id="book-actions" class="dropdown book-actions" role="menu" aria-label="书籍操作" hidden></div><input id="epub-file" type="file" accept=".epub" hidden><div id="toast" class="toast" role="status" hidden></div>
<dialog id="apple-books-dialog" aria-labelledby="apple-dialog-title"><header><h2 id="apple-dialog-title">连接 Apple Books</h2><button id="apple-close" class="icon-button" aria-label="关闭 Apple Books 连接"><i data-icon="X"></i></button></header><p>只读取本机可访问的 EPUB，将所选书籍复制到独立书库。原书与 Apple Books 保持不变。</p><div class="apple-actions"><button id="apple-refresh" class="text-button">刷新书目</button><button id="apple-select-all" class="text-button">全选／取消全选可用书籍</button><button id="apple-disconnect" class="text-button">解除连接</button></div><p id="apple-status" role="status" aria-live="polite"></p><div id="apple-books-list" aria-label="Apple Books 本地书目"></div><footer><button id="apple-import" class="text-button" disabled>纳入所选书籍</button></footer></dialog>
<script src="./appearance.js"></script></body></html>
